[project]
name = "pulse-r24-email-studio"
version = "0.1.0"
description = "Pulse R24 Email Publishing Studio - Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # PDF processing
    "PyMuPDF>=1.25.0",
    "pdfplumber>=0.11.0",
    # Image processing
    "opencv-python-headless>=4.10.0",
    "Pillow>=11.0.0",
    # OCR (optional fallback)
    "pytesseract>=0.3.13",
    # HTML generation
    "Jinja2>=3.1.0",
    "premailer>=3.10.0",
    # Utilities
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
